Object.assign(TC, { brand: 'EDGE FACTORY', bg: '#070A08', fg: '#D8E6DD', gold: G.green, red: G.amber, grey: G.grey, hlbg: G.green, hlfg: '#050607', white: '#FFFFFF' });
const P = { bg: G.bg, fg: G.ink, accent: G.green, line: G.grey, soft: G.panel, gold: G.amber, grey: G.grey, dim: G.dim };
const W = 1280, H = 720;
const ptext = (x, y, t, o = {}) => ktext(P, x, y, t, o);
const typed = (s, t, t0, cps = 10) => s.slice(0, clamp(Math.floor((t - t0) * cps), 0, s.length));
const cursor = t => (Math.floor(t * 2) % 2 === 0 ? '▏' : ' ');

function mac(x, y, w, h, title, inner) {
  return `<g transform="translate(${x} ${y})"><rect width="${w}" height="${h}" rx="10" fill="${G.panel}" stroke="${G.dim}"/>` +
    `<rect width="${w}" height="30" rx="10" fill="#101512"/><rect y="20" width="${w}" height="10" fill="#101512"/>` +
    `<circle cx="18" cy="15" r="5" fill="#FF5F57"/><circle cx="36" cy="15" r="5" fill="#FEBC2E"/><circle cx="54" cy="15" r="5" fill="#28C840"/>` +
    ptext(w / 2, 19, title, { size: 11, anchor: 'middle', color: G.grey, mono: true }) + `<g transform="translate(0 30)">${inner}</g></g>`;
}
const SPEC = { name: 'billing-api', hostname: 'billing', zone: 'dronegrid.io', tier: 'medium', exposure: 'public', database: 'd1', objects: 'yes', container: 'yes' };
function chooseScreen(t, name, host, focus, sel) {
  const sc = new Screen(); tframe(sc, `request an AppStack (${V === 'xp' ? 'Xp' : 'Tofu'} mode)`);
  sc.box(1, 1, 58, 3, 'name (app)', { fg: focus === 0 ? TC.red : TC.grey }); sc.put(2, 2, name + (focus === 0 ? cursor(t) : ''));
  sc.box(59, 1, 58, 3, 'hostname (subdomain)', { fg: focus === 1 ? TC.red : TC.grey }); sc.put(60, 2, host + (focus === 1 ? cursor(t) : ''));
  const cols = [['zone', 26, ['dronegrid.io', 'chargegun.io']], ['tier', 16, ['small', 'medium', 'large']], ['exposure', 19, ['public', 'private', 'hybrid']], ['database', 19, ['none', 'd1', 'postgres']], ['objects (R2)', 18, ['no', 'yes']], ['container', 18, ['no', 'yes']]];
  let x = 1; cols.forEach(([tt, w, items], i) => { tlist(sc, x, 4, w, 23, tt, items, sel[i], focus === i + 2); x += w; });
  tfooter(sc, 'Tab: next field   ↑/↓: choose   Enter: continue   Esc: quit'); return sc;
}
function reviewScreen() {
  const sc = new Screen(); tframe(sc, 'review - this is exactly what will be submitted');
  const lines = V === 'xp'
    ? ['{', '  "apiVersion": "edgefactory.dronegrid.io/v1alpha1",', '  "kind": "AppStack",', '  "metadata": { "name": "billing-api", "namespace": "team-billing" },', '  "spec": {', '    "zone": "dronegrid.io", "hostname": "billing",', '    "tier": "medium", "exposure": "public",', '    "database": "d1", "objects": true, "container": true', '  }', '}']
    : ['{', '  "apps": {', '    "billing-api": {', '      "zone": "dronegrid.io",', '      "hostname": "billing",', '      "tier": "medium",', '      "exposure": "public",', '      "database": "d1",', '      "objects": true,', '      "container": true', '    }', '  }', '}'];
  lines.forEach((l, i) => sc.put(2, 1 + i, l, { fg: '#FFFFFF' }));
  tfooter(sc, 'Enter: submit   ←: back   Esc: quit'); return sc;
}
function doneScreen() {
  const sc = new Screen(); tframe(sc, 'request written');
  sc.put(2, 1, 'file   ', { fg: TC.grey }); sc.put(9, 1, 'infra/live/prod/requests/billing-api.json', { fg: TC.gold });
  sc.put(2, 3, V === 'go' ? 'git add, commit, then `make push`. The tofu-controller plans within 5 minutes.' : 'git add, commit, open a PR. plan.yml plans; you review; apply.yml applies exactly that plan.');
  sc.put(2, 5, 'The platform\'s opinions (WAF, rate limits, replication, observability) are applied', { fg: TC.grey });
  sc.put(2, 6, 'by the profile layer; you never see a Cloudflare attribute.', { fg: TC.grey });
  tfooter(sc, 'Esc: quit'); return sc;
}
function watchScreen(n) {
  const sc = new Screen(); tframe(sc, 'converging - Crossplane is reconciling your stack');
  sc.put(2, 1, 'freight   ', { fg: TC.grey }); sc.put(12, 1, 'ghcr.io/isgo-golgo13/edge-factory-xp/freight/team-billing:team-billing-billing-api-1790870400', { fg: TC.gold });
  sc.put(2, 2, 'digest    ', { fg: TC.grey }); sc.put(12, 2, 'sha256:4a1f9c1e7b2d0e6f53a8c1d4e9b7f2a0c6d3e8b1f4a7c0d9e2b5f8a1c4d7e0b3f6');
  sc.put(2, 3, 'requested ', { fg: TC.grey }); sc.put(12, 3, 'tomas@dronegrid.io at 2026-10-01T09:04:05Z');
  const ready = n >= 5;
  sc.put(2, 6, ready ? 'READY' : 'NOT READY', { fg: ready ? TC.gold : TC.red, bold: true }); sc.put(ready ? 8 : 12, 6, `   synced=true   ${ready ? 'Successfully composed' : 'Composing resources'}`, { fg: TC.grey });
  const rows = [['hostname', 'billing.dronegrid.io', 1], ['worker', 'billing-api', 1], ['d1', '5f3c…-db', 2], ['r2', 'billing-api-objects', 3], ['hyperdrive', '—', 1], ['access', '—', 1], ['load balancer', '—', 1]];
  rows.forEach(([k, v, at], i) => sc.put(2, 8 + i, `  ${k.padEnd(18)} ${n >= at ? v : '…'}`));
  if (ready) { sc.put(2, 16, 'wrangler bindings (paste into wrangler.jsonc):', { fg: TC.gold }); ['{ "name": "billing-api", "routes": [{ "pattern": "billing.dronegrid.io", "custom_domain": true }],', '  "d1_databases": [{ "binding": "DB", "database_id": "5f3c…" }],', '  "r2_buckets": [{ "binding": "OBJECTS", "bucket_name": "billing-api-objects" }],', '  "containers": [{ "class_name": "AppContainer", "max_instances": 5 }] }'].forEach((l, i) => sc.put(4, 17 + i, l, { fg: '#FFFFFF' })); }
  tfooter(sc, 'polling every 3 s   Esc: quit (the stack keeps converging)'); return sc;
}
// Cloudflare canvas: nodes appear in order after dispatch
function cfCanvas(t, t0, w, h) {
  const L = 80, C = w / 2, R = w - 80, y1 = 0.17 * h + 20, y2 = 0.47 * h + 20, y3 = 0.78 * h + 20;
  const nodes = [
    ['worker', 'Worker shell', 'billing-api · custom domain', C, y2, 0],
    ['dns', 'billing.dronegrid.io', 'proxied · TLS 1.2+', C, y1, 0.8],
    ['waf', 'Zone baseline', 'WAF · 1200 rpm', L, y2, 1.6],
    ['r2', 'R2 bucket', 'objects · cold 90d', L, y3, 2.4],
    ['d1', 'D1 database', 'replication on', R, y3, 3.2],
    ['obs', 'Observability', 'sampling 0.5', R, y2, 4.0],
    ['app', 'Container', 'wrangler deploy · max 5', C, y3, 5.4],
  ];
  let s = `<rect width="${w}" height="${h}" fill="${G.bg}"/>`;
  s += ptext(16, 22, 'CLOUDFLARE · dronegrid.io', { size: 11, color: G.grey, weight: 700 });
  const pos = Object.fromEntries(nodes.map(n => [n[0], [n[3], n[4]]]));
  const edges = [['dns', 'worker', 0.9], ['waf', 'worker', 1.7], ['r2', 'worker', 2.5], ['d1', 'worker', 3.3], ['obs', 'worker', 4.1], ['app', 'worker', 5.5]];
  edges.forEach(([a, b, at]) => { const [x1, y1] = pos[a], [x2, y2] = pos[b]; s += line(P, x1, y1, x2, y2, fade(t, t0 + at, 0.5), { color: G.green2, sw: 2 }); });
  nodes.forEach(([id, title, sub, x, y, at]) => {
    const op = fade(t, t0 + at, 0.5); if (op <= 0) return;
    const sc = 0.85 + 0.15 * op;
    s += `<g opacity="${op.toFixed(2)}" transform="translate(${x} ${y}) scale(${sc.toFixed(3)})">` +
      `<rect x="-66" y="-24" width="132" height="48" rx="8" fill="${G.panel}" stroke="${id === 'worker' ? G.green : G.dim}" stroke-width="${id === 'worker' ? 2.5 : 1.5}"/>` +
      ktext(P, 0, -5, title, { size: 11, weight: 700, anchor: 'middle', color: G.ink }) + ktext(P, 0, 11, sub, { size: 8.5, anchor: 'middle', color: G.grey }) + `</g>`;
    s += check(P, x + 60, y - 20, fade(t, t0 + at + 0.6, 0.3));
  });
  s += packet(P, pos.app[0], pos.app[1] - 24, pos.worker[0], pos.worker[1] + 24, (t - (t0 + 5.6)) / 1.0, 'image', { color: G.amber });
  return s;
}
function pipelinePanel(t, t0, w, h) {
  const steps = V === 'ngo'
    ? [['PR opened', 'check · 16 guard tests'], ['plan', 'OIDC → OpenBao → scoped token'], ['gate + review', 'the plan lists every object'], ['merge → apply', '13 provenance checks · exact plan']]
    : [['make push', 'tree:main → GHCR'], ['Flux pull', 'OCIRepository · 1m'], ['tofu-controller', 'plan every 5m'], ['apply', 'drift corrected']];
  let s = `<rect width="${w}" height="${h}" fill="${G.bg}"/>` + ptext(16, 22, V === 'ngo' ? 'GITHUB ACTIONS' : 'K3S · FLUX + TOFU-CONTROLLER', { size: 11, color: G.grey, weight: 700 });
  steps.forEach(([a, b], i) => {
    const y = 40 + i * 44, op = fade(t, t0 + i * 0.9, 0.5);
    s += slide(op, 10, `<rect x="16" y="${y}" width="${w - 32}" height="36" rx="7" fill="${G.panel}" stroke="${i === steps.length - 1 ? G.green : G.dim}" stroke-width="${i === steps.length - 1 ? 2 : 1.5}"/>` + ptext(30, y + 18, a, { size: 12, weight: 700 }) + ptext(30, y + 34, b, { size: 10, color: G.grey }));
    s += check(P, w - 36, y + 18, fade(t, t0 + i * 0.9 + 0.6, 0.3));
  });
  return s;
}
const story = (() => {
  const TS = 0.72, TWS = TW * TS, THS = TH * TS; // terminal scale
  const dispatch = 20; // t when Enter is pressed on review
  const scenes = [
    { t0: 0, t1: 9, title: 'Choose', lines: ['The terminal renders prompts from platform/spec.schema.json (or the XRD): six fields, nothing provider-shaped. Newest zones and the platform tiers come from the catalog.'] },
    { t0: 9, t1: 20, title: 'Review', lines: [V === 'xp' ? 'The exact AppStack object that will be signed as freight and applied.' : 'The exact requests/billing-api.json the OpenTofu root will merge. Keys are canonical; this is what gets fingerprinted into the plan provenance.'] },
    { t0: 20, t1: 30, title: V === 'xp' ? 'Dispatch: validate → freight → apply → admission' : V === 'ngo' ? 'Dispatch: a file, a PR, a plan, a gate, an exact apply' : 'Dispatch: a file, a push, Flux pulls, the controller converges', lines: [V === 'xp' ? 'The SSIP service verifies your SSO token, validates against the XRD, pushes a cosign-signed artifact to GHCR, applies the XR. The admission policy admits it only from the SSIP identity with a digest.' : V === 'ngo' ? 'plan.yml plans with a 15-minute OpenBao token and a read-scoped Cloudflare token; you read the plan; apply.yml verifies 13 fingerprints and applies with an edit-scoped token.' : 'make push publishes the committed tree as an OCI artifact; Flux pulls it; the Terraform CR plans and applies within five minutes, and keeps doing so.'] },
    { t0: 30, t1: 40, title: 'The profile layer draws the stack', lines: ['tier: medium → sampling 0.5, D1 replication on, R2 cold tier at 90 days, 1200 rpm. exposure: public → proxied custom domain + managed WAF; no Access, no LB. database: d1, objects: true, container: true.', 'Platform owns shell + data. The last step is yours: wrangler deploy ships the Rust container into the shell.'] },
    { t0: 40, t1: 46, title: 'Done', lines: ['One request, one stack, every guard included. Change the loop (NGO → GO → XP); the six fields and the profile table do not change.'] },
  ];
  const duration = 46;
  return {
    duration, title: `Edge Factory ${V.toUpperCase()}`,
    frame(t) {
      t = clamp(t, 0, duration);
      let body = `<rect width="${W}" height="${H}" fill="${G.bg}"/>`;
      body += ptext(40, 36, `EDGE FACTORY · ${V.toUpperCase()} · SELF-SERVICE PLAY-THROUGH`, { size: 12, weight: 700, color: G.green });
      body += ptext(W - 40, 36, `${Math.floor(t)}s`, { size: 11, color: G.grey, anchor: 'end' });
      // terminal window
      let sc;
      if (t < 9) { const name = typed('billing-api', t, 0.6), host = typed('billing', t, 2.2); let focus = t < 2.0 ? 0 : t < 3.4 ? 1 : t < 4.4 ? 2 : t < 5.4 ? 3 : t < 6.2 ? 4 : t < 7.0 ? 5 : t < 7.8 ? 6 : 7; const sel = [0, t > 5.0 ? 1 : 0, 0, t > 6.6 ? 1 : 0, t > 7.4 ? 1 : 0, t > 8.2 ? 1 : 0]; sc = chooseScreen(t, name, host, focus, sel); }
      else if (t < dispatch) sc = reviewScreen();
      else if (V === 'xp') sc = watchScreen(Math.min(5, Math.floor((t - dispatch) / 2.2)));
      else sc = doneScreen();
      body += mac(40, 56, TWS + 2, THS + 32, `edgefactory --mode ${V === 'xp' ? 'xp' : 'tofu'} --repo .`, `<g transform="scale(${TS})">${sc.inner(false)}</g>`);
      // right column: pipeline (ngo/go) or freight (xp), then cloudflare canvas
      const rx = 40 + TWS + 24, rw = W - rx - 40;
      const rightTop = V === 'xp'
        ? `<rect width="${rw}" height="150" fill="${G.bg}"/>` + ptext(16, 22, 'SSIP · FREIGHT · ADMISSION', { size: 11, color: G.grey, weight: 700 }) +
          [['OIDC verified', 0], ['schema valid', 0.7], ['freight pushed + signed', 1.4], ['XR applied · admission ok', 2.1]].map(([l, at], i) => { const op = fade(t, dispatch + at, 0.4); return slide(op, 8, ptext(40, 50 + i * 24, l, { size: 12 })) + check(P, 24, 46 + i * 24, fade(t, dispatch + at + 0.3, 0.3)); }).join('')
        : pipelinePanel(t, dispatch + 0.3, rw, 220);
      const topH = V === 'xp' ? 150 : 220;
      body += mac(rx, 56, rw, topH + 30, V === 'xp' ? 'edgefactory-ssip' : V === 'ngo' ? 'github.com/isgo-golgo13/edge-factory-ngo' : 'flux + tofu-controller @ k3s-edge', rightTop);
      const cy = 56 + topH + 30 + 16, ch = H - cy - 118;
      body += mac(rx, cy, rw, ch, 'dash.cloudflare.com · dronegrid.io', cfCanvas(t, V === 'xp' ? dispatch + 2.5 : dispatch + 4.2, rw, ch - 30));
      // caption
      let cap = '';
      for (const sc2 of scenes) { if (t >= sc2.t0 && t < sc2.t1) { cap = `<rect x="0" y="${H - 102}" width="${W}" height="102" fill="${G.panel}"/><rect x="0" y="${H - 102}" width="${W}" height="2" fill="${G.green}"/>` + ptext(40, H - 72, sc2.title.toUpperCase(), { size: 13, weight: 700, color: G.green }) + sc2.lines.flatMap(l => { const out = []; let cur = ''; for (const w of l.split(' ')) { if ((cur + ' ' + w).trim().length > 165) { out.push(cur.trim()); cur = w; } else cur += ' ' + w; } if (cur.trim()) out.push(cur.trim()); return out; }).map((l, i) => ptext(40, H - 50 + i * 18, l, { size: 12.5, color: G.ink })).join(''); } }
      const prog = clamp(t / duration, 0, 1);
      body += `<rect x="40" y="${H - 110}" width="${W - 80}" height="2" fill="${G.dim}"/><rect x="40" y="${H - 110}" width="${((W - 80) * prog).toFixed(1)}" height="2" fill="${G.green}"/>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${body}${cap}</svg>`;
    }
  };
})();

(function(){
  const stage=document.getElementById('stage'), play=document.getElementById('play'), seek=document.getElementById('seek'), time=document.getElementById('time'), loop=document.getElementById('loop');
  const D=story.duration; let t=0, playing=false, last=0, lastDrawn=-1;
  function draw(){ const q=Math.round(t*30)/30; if(q!==lastDrawn){ stage.innerHTML=story.frame(q); lastDrawn=q; } seek.value=Math.round(t/D*1000); time.textContent=t.toFixed(1)+' s'; }
  function tick(now){ if(!playing) return; t+=(now-last)/1000; last=now; if(t>=D){ if(loop.checked) t=0; else { t=D; playing=false; play.textContent='Play'; } } draw(); requestAnimationFrame(tick); }
  function setPlaying(p){ playing=p; play.textContent=p?'Pause':'Play'; if(p){ if(t>=D) t=0; last=performance.now(); requestAnimationFrame(tick); } }
  play.onclick=()=>setPlaying(!playing); document.getElementById('restart').onclick=()=>{ t=0; draw(); }; seek.oninput=()=>{ t=seek.value/1000*D; draw(); };
  document.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); setPlaying(!playing);} if(e.code==='ArrowRight'){ t=Math.min(D,t+2); draw(); } if(e.code==='ArrowLeft'){ t=Math.max(0,t-2); draw(); } if(e.code==='Home'){ t=0; draw(); } });
  draw();
})();
