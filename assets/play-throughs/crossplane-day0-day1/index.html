const P = { bg: G.bg, fg: G.ink, accent: G.green, line: G.grey, soft: G.panel, gold: G.amber, grey: G.grey, dim: G.dim };
const W = 1280, H = 720;
const T = (x, y, t, o = {}) => ktext(P, x, y, t, o);
const card = (x, y, w, h, title, body = [], o = {}) => {
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${o.fill ?? G.panel}" stroke="${o.stroke ?? G.dim}" stroke-width="${o.sw ?? 1.5}"/>`;
  s += T(x + w / 2, y + (body.length ? 20 : h / 2 + 4), title, { size: o.size ?? 12, weight: 700, anchor: 'middle', color: o.color ?? G.ink, mono: o.mono });
  body.forEach((b, i) => s += T(x + w / 2, y + 38 + i * 15, b, { size: 10, anchor: 'middle', color: G.grey, mono: o.mono }));
  return s;
};
const note = (x, y, str, max = 92) => { const out = []; let cur = ''; for (const w of str.split(' ')) { if ((cur + ' ' + w).trim().length > max) { out.push(cur.trim()); cur = w; } else cur += ' ' + w; } if (cur.trim()) out.push(cur.trim()); return out.map((l, i) => T(x, y + i * 17, l, { size: 12, color: G.grey, italic: true })).join(''); };
const strobe = (t, period = 1.2) => 0.35 + 0.65 * Math.abs(Math.sin((t / period) * Math.PI));
const mac = (x, y, w, h, title, inner) => `<g transform="translate(${x} ${y})"><rect width="${w}" height="${h}" rx="10" fill="${G.panel}" stroke="${G.dim}"/><rect width="${w}" height="28" rx="10" fill="#101512"/><rect y="18" width="${w}" height="10" fill="#101512"/><circle cx="18" cy="14" r="5" fill="#FF5F57"/><circle cx="36" cy="14" r="5" fill="#FEBC2E"/><circle cx="54" cy="14" r="5" fill="#28C840"/>${T(w / 2, 18, title, { size: 11, anchor: 'middle', color: G.grey, mono: true })}<g transform="translate(0 28)">${inner}</g></g>`;

// The cluster, drawn in every scene (right side), with components lighting up over time.
function cluster(t, on) {
  const x = 700, y = 60, w = 540, h = 440;
  let s = mac(x, y, w, h, 'k3s · crossplane-system · edgefactory-system', '');
  const inner = (ix, iy, iw, ih, title, body, key, o = {}) => slide(fade(t, on[key] ?? 0, 0.5), 8, card(x + ix, y + 28 + iy, iw, ih, title, body, o));
  s += inner(16, 12, 132, 56, 'Crossplane 2.4', ['composition engine'], 'core', { stroke: G.green });
  s += inner(160, 12, 214, 56, 'provider-upjet-cloudflare', ['official · namespaced'], 'provider', { mono: true, size: 11 });
  s += inner(386, 12, 138, 56, 'functions', ['env-configs · templating', 'auto-ready'], 'functions');
  s += inner(16, 84, 230, 70, 'XRD  AppStack', ['spec: 6 fields   status: 8 fields', 'edgefactory.dronegrid.io/v1alpha1'], 'xrd', { stroke: G.green, sw: 2.5, mono: true });
  s += inner(262, 84, 262, 70, 'Composition', ['pipeline: environment → render → ready', 'the opinions table as data'], 'comp', { stroke: G.green, sw: 2.5 });
  s += inner(16, 170, 150, 56, 'EnvironmentConfigs', ['tiers · zones · account'], 'env');
  s += inner(182, 170, 170, 60, 'Kyverno', ['admission: SSIP identity', '+ freight digest'], 'kyverno', { stroke: G.amber });
  s += inner(368, 170, 156, 56, 'OTel collector', ['traces · metrics · logs'], 'otel');
  s += slide(fade(t, on.inv ?? 0, 0.5), 8, `<rect x="${x + 16}" y="${y + 28 + 242}" width="508" height="76" rx="8" fill="${G.panel}" stroke="${G.dim}" stroke-width="1.5"/>` + T(x + 28, y + 28 + 260, 'inventory  (ever-growing, day 0)', { size: 11, weight: 700, color: G.grey }));
  const pk = ['AppStack v1', 'AppStack v2', 'EdgeDB', 'RustService', 'StaticSite', 'Queue'];
  pk.forEach((p, i) => { const op = fade(t, (on.inv ?? 0) + 0.5 + i * 0.5, 0.35); s += g(op, `<rect x="${x + 28 + i * 82}" y="${y + 28 + 274}" width="74" height="24" rx="5" fill="#101512" stroke="${i < 2 ? G.green : G.dim}"/>` + T(x + 65 + i * 82, y + 28 + 290, p, { size: 9.5, anchor: 'middle', color: i < 2 ? G.green : G.grey })); });
  s += slide(fade(t, on.ns ?? 0, 0.5), 8, `<rect x="${x + 16}" y="${y + 28 + 330}" width="508" height="72" rx="8" fill="${G.panel}" stroke="${G.dim}" stroke-width="1.5"/>` + T(x + 28, y + 28 + 348, 'namespace team-billing', { size: 11, weight: 700, color: G.grey }));
  return s;
}

const story = {
  duration: 78, title: 'How Crossplane 2 actually works',
  frame(t) {
    t = clamp(t, 0, 78);
    let b = `<rect width="${W}" height="${H}" fill="${G.bg}"/>` + T(40, 36, 'HOW CROSSPLANE 2 ACTUALLY WORKS · DAY 0 → DAY 1 · CLOUDFLARE', { size: 12, weight: 700, color: G.green }) + T(W - 40, 36, `${Math.floor(t)}s`, { size: 11, color: G.grey, anchor: 'end' });
    const on = { core: 2, provider: 3, functions: 3.6, xrd: 16, comp: 17, env: 18, kyverno: 4.2, otel: 4.8, inv: 20, ns: 32 };
    b += cluster(t, on);
    // ---------- left column by scene ----------
    let left = '';
    const lx = 40, lw = 620;
    if (t < 12) {
      // Day 0: platform engineer, bootstrap
      left += slide(fade(t, 0.3), 10, card(lx, 70, lw, 70, 'DAY 0 · platform engineering', ['one person, once: make bootstrap → Crossplane, provider, functions, Kyverno, OTel on the cluster'], { color: G.green }));
      const steps = [['make bootstrap', 'OpenTofu installs Crossplane on k3s'], ['provider + functions', 'pulled as signed OCI packages'], ['Kyverno + OTel', 'guards and telemetry before any request exists']];
      steps.forEach(([a, c], i) => left += slide(fade(t, 1.5 + i * 1.6), 10, card(lx, 160 + i * 80, lw, 64, a, [c], { mono: i === 0 })));
      left += g(fade(t, 7), note(lx, 420, 'A controller cannot install the cluster it is not on yet. OpenTofu does that once, then goes dormant.'));
    } else if (t < 32) {
      // XRD + Composition authoring, packaging, registration
      const tt = t - 12;
      left += slide(fade(tt, 0.2), 10, card(lx, 70, lw, 48, 'DAY 0 · write the API once: XRD (what they may ask) + Composition (what it becomes)', [], { color: G.green, size: 11 }));
      // XRD anatomy with strobing arrows
      const xx = lx, xy = 132;
      left += slide(fade(tt, 0.8), 10, `<rect x="${xx}" y="${xy}" width="${lw}" height="200" rx="8" fill="${G.panel}" stroke="${G.green}" stroke-width="2"/>` + T(xx + 14, xy + 22, 'CompositeResourceDefinition  AppStack  (scope: Namespaced)', { size: 12, weight: 700, mono: true }));
      const specF = ['zone', 'hostname', 'tier', 'exposure', 'database', 'objects'];
      const statF = ['hostname', 'worker', 'd1DatabaseId', 'r2Bucket', 'accessApplicationId', 'wranglerBindings'];
      left += g(fade(tt, 1.2), T(xx + 160, xy + 48, 'spec  (the friendly inputs)', { size: 11, weight: 700, color: G.amber }) + T(xx + 440, xy + 48, 'status  (the window back)', { size: 11, weight: 700, color: G.green }));
      specF.forEach((f, i) => { const op = fade(tt, 1.6 + i * 0.25); left += g(op, T(xx + 160, xy + 70 + i * 20, f, { size: 11, mono: true })); left += g(op * strobe(t), line(P, xx + 100, xy + 66 + i * 20, xx + 150, xy + 66 + i * 20, 1, { color: G.amber, sw: 2 })); });
      statF.forEach((f, i) => { const op = fade(tt, 3.2 + i * 0.25); left += g(op, T(xx + 440, xy + 70 + i * 20, f, { size: 11, mono: true })); left += g(op * strobe(t + 0.6), line(P, xx + 572, xy + 66 + i * 20, xx + 608, xy + 66 + i * 20, 1, { color: G.green, sw: 2 })); });
      left += g(fade(tt, 1.6), T(xx + 20, xy + 110, 'TUI', { size: 11, weight: 700, color: G.amber }) + T(xx + 20, xy + 124, 'writes', { size: 9.5, color: G.grey }));
      left += g(fade(tt, 3.2), T(xx + 612, xy + 110, '→', { size: 14, color: G.green }));
      left += slide(fade(tt, 5.5), 10, card(lx, 348, 300, 70, 'Composition (pipeline)', ['patch-and-transform as data:', 'tier → sampling, replication, rate limit…'], { stroke: G.green }));
      left += slide(fade(tt, 6.5), 10, card(lx + 320, 348, 300, 70, 'make build · publish · register', ['xpkg → cosign → GHCR →', 'Configuration installs XRD + Composition'], { mono: true }));
      left += packet(P, lx + 470, 418, 700 + 16 + 115, 60 + 28 + 84, (tt - 7.2) / 1.2, 'xpkg', { color: G.green });
      left += g(fade(tt, 9.5), note(lx, 450, 'Registration = the inventory grows. Each package is a pre-registered XRD + Composition pair; the elves stock the shelf before any customer arrives.'));
    } else if (t < 50) {
      // Day 1: consumer submits via TUI; SSIP; Kyverno; match?
      const tt = t - 32;
      left += slide(fade(tt, 0.2), 10, card(lx, 70, lw, 48, 'DAY 1 · an app team asks, in the SSIP terminal', [], { color: G.green, size: 11 }));
      left += slide(fade(tt, 0.8), 10, mac(lx, 130, 300, 150, 'edgefactory --mode xp', `<rect width="300" height="122" fill="#070A08"/>` + [['zone', 'dronegrid.io'], ['hostname', 'billing'], ['tier', 'medium'], ['exposure', 'public'], ['database', 'd1'], ['objects', 'true']].map(([k, v], i) => T(12, 20 + i * 17, `${k.padEnd(10)} ${v}`, { size: 10.5, mono: true, color: tt > 1.2 + i * 0.3 ? G.ink : '#3a443e' })).join('')));
      left += slide(fade(tt, 3.6), 10, card(lx + 320, 130, 300, 150, 'SSIP service', ['1 OIDC verified', '2 schema valid (the XRD\'s OpenAPI v3)', '3 freight pushed + cosign-signed', '4 AppStack applied with digest'], { stroke: G.green }));
      [0, 1, 2, 3].forEach(i => left += check(P, lx + 320 + 300 - 22, 164 + i * 15, fade(tt, 4.2 + i * 0.6, 0.3)));
      left += packet(P, lx + 470, 280, 700 + 16 + 85, 60 + 28 + 170, (tt - 6.6) / 1.0, 'AppStack', { color: G.amber });
      left += slide(fade(tt, 8.0), 10, card(lx, 300, lw, 54, 'Kyverno admission', ['from the SSIP ServiceAccount?  freight digest present?  → admitted'], { stroke: G.amber }));
      left += check(P, lx + lw - 24, 318, fade(tt, 9.0, 0.3));
      left += slide(fade(tt, 10.0), 10, card(lx, 372, lw, 90, 'Crossplane inspects itself', ['is an XRD registered for kind AppStack / edgefactory.dronegrid.io?  → yes (day 0)', 'is there a Composition whose compositeTypeRef matches, with the selected labels?  → yes', 'then: render the pipeline → managed resources → the provider reconciles each one'], { stroke: G.green }));
      [0, 1, 2].forEach(i => left += check(P, lx + lw - 24, 404 + i * 15, fade(tt, 11 + i * 0.8, 0.3)));
      left += g(fade(tt, 14.5), note(lx, 490, 'Nothing is improvised at request time. Only what platform engineering pre-registered can be served.'));
    } else if (t < 60) {
      // no-match branch
      const tt = t - 50;
      left += slide(fade(tt, 0.2), 10, card(lx, 70, lw, 48, 'THE OTHER BRANCH · a kind nobody registered', [], { color: G.red, size: 11 }));
      left += slide(fade(tt, 0.8), 10, mac(lx, 130, 300, 110, 'kubectl apply', `<rect width="300" height="82" fill="#070A08"/>` + T(12, 22, 'kind: GpuCluster', { size: 11, mono: true, color: G.ink }) + T(12, 40, 'apiVersion: edgefactory.dronegrid.io/v1', { size: 10, mono: true, color: G.grey }) + T(12, 64, 'no such XRD · no Composition', { size: 10.5, mono: true, color: G.red })));
      left += slide(fade(tt, 2.0), 10, card(lx + 320, 130, 300, 110, 'API server', ['unknown kind → rejected at the door', 'and even a known kind from kubectl', 'is denied by Kyverno (not the SSIP identity)'], { stroke: G.red }));
      left += g(fade(tt, 2.6), `<circle cx="${lx + 596}" cy="${154}" r="11" fill="${G.red}"/>` + T(lx + 596, 158, '✕', { size: 12, anchor: 'middle', color: '#fff', weight: 700 }));
      left += slide(fade(tt, 4.0), 10, card(lx, 262, lw, 70, 'Why this matters', ['Self-service has a ceiling, and the ceiling is the inventory. Day 0 decides what day 1 can ask for;', 'the API is the contract, the controller is the enforcement.'], { stroke: G.dim }));
    } else {
      // reconcile loop + observability + summary
      const tt = t - 60;
      left += slide(fade(tt, 0.2), 10, card(lx, 70, lw, 48, 'FOREVER · reconcile per resource, observe everything', [], { color: G.green, size: 11 }));
      const cx = lx + 150, cy = 230, r = 80;
      left += g(fade(tt, 0.8), `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${G.dim}" stroke-width="2" stroke-dasharray="8 6"/>` + T(cx, cy - 4, 'each MR', { size: 11, weight: 700, anchor: 'middle' }) + T(cx, cy + 12, 'observe → diff → correct', { size: 9.5, anchor: 'middle', color: G.grey }));
      const ang = -Math.PI / 2 + ((t * 1.1) % (Math.PI * 2));
      left += g(fade(tt, 1.0), `<circle cx="${cx + Math.cos(ang) * r}" cy="${cy + Math.sin(ang) * r}" r="7" fill="${G.green}"/>`);
      left += slide(fade(tt, 1.6), 10, card(lx + 300, 150, 320, 76, 'Status flows back', ['hostname, worker, d1DatabaseId, r2Bucket,', 'wranglerBindings → the TUI window; wrangler deploy next'], { stroke: G.green }));
      left += slide(fade(tt, 3.0), 10, card(lx + 300, 240, 320, 76, 'OpenTelemetry', ['reconcile traces, MR conditions as metrics,', 'provider API calls as spans → your Grafana'], { stroke: G.dim }));
      left += slide(fade(tt, 4.4), 10, card(lx, 340, lw, 110, 'What you just watched', ['Day 0: bootstrap once; author XRD + Composition; package, sign, register → inventory.', 'Day 1: six friendly fields through SSIP → signed freight → admitted → matched to the registered pair → composed.', 'Forever: per-resource reconciliation, status back to the user, nothing read from git at runtime.'], { stroke: G.green }));
    }
    b += left;
    // request lands in the namespace (day 1 onwards)
    if (t >= 40) { const op = fade(t, 40, 0.6); b += slide(op, 6, card(700 + 32, 60 + 28 + 354, 180, 44, 'AppStack billing-api', ['freight sha256:4a1f…'], { stroke: G.amber, mono: true, size: 10.5 })); }
    if (t >= 44) { ['WorkersScript', 'WorkerDomain', 'R2Bucket', 'D1Database'].forEach((m, i) => b += slide(fade(t, 44 + i * 0.8, 0.5), 6, card(700 + 232 + (i % 2) * 150, 60 + 28 + 356 + Math.floor(i / 2) * 22, 140, 18, m, [], { size: 9.5, mono: true, stroke: G.green2 }))); }
    // caption
    const scenes = [[0, 12, 'Day 0 — the substrate', 'Platform engineering runs make bootstrap once. Crossplane, the official upjet Cloudflare provider, the three functions, Kyverno and the OTel collector exist before any request does.'], [12, 32, 'Day 0 — the API, pre-registered', 'An XRD declares the six friendly spec fields and the status window; the Composition is the opinions table rendered into managed resources. Packaged, signed, installed by a Configuration: the inventory grows.'], [32, 50, 'Day 1 — self-service', 'The SSIP terminal writes the spec; the service verifies identity, validates against the XRD, stores signed freight, applies the AppStack. Kyverno admits it; Crossplane looks for the registered XRD + Composition pair and composes.'], [50, 60, 'No match, no service', 'A kind nobody registered is rejected by the API server; a known kind from kubectl is denied by Kyverno. Day 0 decides what day 1 may ask for.'], [60, 78, 'Forever', 'Each managed resource reconciles on its own; status flows back into the XR and the terminal; OpenTelemetry carries every reconcile. Then: wrangler deploy into the shell.']];
    for (const [a, c, h, l] of scenes) if (t >= a && t < c) b += `<rect x="0" y="${H - 96}" width="${W}" height="96" fill="${G.panel}"/><rect x="0" y="${H - 96}" width="${W}" height="2" fill="${G.green}"/>` + T(40, H - 66, h.toUpperCase(), { size: 13, weight: 700, color: G.green }) + (() => { const out = []; let cur = ''; for (const w of l.split(' ')) { if ((cur + ' ' + w).trim().length > 170) { out.push(cur.trim()); cur = w; } else cur += ' ' + w; } if (cur.trim()) out.push(cur.trim()); return out.map((x, i) => T(40, H - 44 + i * 18, x, { size: 12.5 })).join(''); })();
    b += `<rect x="40" y="${H - 104}" width="${W - 80}" height="2" fill="${G.dim}"/><rect x="40" y="${H - 104}" width="${((W - 80) * t / 78).toFixed(1)}" height="2" fill="${G.green}"/>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${b}</svg>`;
  }
};

(function(){
  const stage=document.getElementById('stage'), play=document.getElementById('play'), seek=document.getElementById('seek'), time=document.getElementById('time'), loop=document.getElementById('loop');
  const D=story.duration; let t=0, playing=false, last=0, lastDrawn=-1;
  function draw(){ const q=Math.round(t*30)/30; if(q!==lastDrawn){ stage.innerHTML=story.frame(q); lastDrawn=q; } seek.value=Math.round(t/D*1000); time.textContent=t.toFixed(1)+' s'; }
  function tick(now){ if(!playing) return; t+=(now-last)/1000; last=now; if(t>=D){ if(loop.checked) t=0; else { t=D; playing=false; play.textContent='Play'; } } draw(); requestAnimationFrame(tick); }
  function setPlaying(p){ playing=p; play.textContent=p?'Pause':'Play'; if(p){ if(t>=D) t=0; last=performance.now(); requestAnimationFrame(tick); } }
  play.onclick=()=>setPlaying(!playing); document.getElementById('restart').onclick=()=>{ t=0; draw(); }; seek.oninput=()=>{ t=seek.value/1000*D; draw(); };
  document.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); setPlaying(!playing);} if(e.code==='ArrowRight'){ t=Math.min(D,t+2); draw(); } if(e.code==='ArrowLeft'){ t=Math.max(0,t-2); draw(); } if(e.code==='Home'){ t=0; draw(); } });
  draw();
})();
</script></body></html>
