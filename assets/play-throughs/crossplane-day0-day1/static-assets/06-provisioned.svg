deploy next</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="340" y="240" width="320" height="76" rx="8" fill="#0B0E0C" stroke="#2A332E" stroke-width="1.5"/><text x="500" y="260" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E6F2EA" text-anchor="middle">OpenTelemetry</text><text x="500" y="278" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">reconcile traces, MR conditions as metrics,</text><text x="500" y="293" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">provider API calls as spans → your Grafana</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="40" y="340" width="620" height="110" rx="8" fill="#0B0E0C" stroke="#3DFF9A" stroke-width="1.5"/><text x="350" y="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E6F2EA" text-anchor="middle">What you just watched</text><text x="350" y="378" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">Day 0: bootstrap once; author XRD + Composition; package, sign, register → inventory.</text><text x="350" y="393" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">Day 1: six friendly fields through SSIP → signed freight → admitted → matched to the registered pair → composed.</text><text x="350" y="408" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">Forever: per-resource reconciliation, status back to the user, nothing read from git at runtime.</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="732" y="442" width="180" height="44" rx="8" fill="#0B0E0C" stroke="#FFB000" stroke-width="1.5"/><text x="822" y="462" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">AppStack billing-api</text><text x="822" y="480" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">freight sha256:4a1f…</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="932" y="444" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1002" y="457" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">WorkersScript</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="1082" y="444" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1152" y="457" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">WorkerDomain</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="932" y="466" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1002" y="479" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">R2Bucket</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="1082" y="466" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1152" y="479" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">D1Database</text></g><rect x="0" y="624" width="1280" height="96" fill="#0B0E0C"/><rect x="0" y="624" width="1280" height="2" fill="#3DFF9A"/><text x="40" y="654" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3DFF9A" text-anchor="start">FOREVER</text><text x="40" y="676" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#E6F2EA" text-anchor="start">Each managed resource reconciles on its own; status flows back into the XR and the terminal; OpenTelemetry carries every reconcile. Then: wrangler deploy into the shell.</text><rect x="40" y="616" width="1200" height="2" fill="#2A332E"/><rect x="40" y="616" width="1107.7" height="2" fill="#3DFF9A"/></svg>