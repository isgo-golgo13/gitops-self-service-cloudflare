 d="M633,209 l4,4 l7,-8" stroke="#FFFFFF" stroke-width="2.5" fill="none"/></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="40" y="300" width="620" height="54" rx="8" fill="#0B0E0C" stroke="#FFB000" stroke-width="1.5"/><text x="350" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E6F2EA" text-anchor="middle">Kyverno admission</text><text x="350" y="338" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">from the SSIP ServiceAccount?  freight digest present?  → admitted</text></g><g opacity="1.000"><circle cx="636" cy="318" r="11" fill="#3DFF9A"/><path d="M631,318 l4,4 l7,-8" stroke="#FFFFFF" stroke-width="2.5" fill="none"/></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="40" y="372" width="620" height="90" rx="8" fill="#0B0E0C" stroke="#3DFF9A" stroke-width="1.5"/><text x="350" y="392" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E6F2EA" text-anchor="middle">Crossplane inspects itself</text><text x="350" y="410" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">is an XRD registered for kind AppStack / edgefactory.dronegrid.io?  → yes (day 0)</text><text x="350" y="425" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">is there a Composition whose compositeTypeRef matches, with the selected labels?  → yes</text><text x="350" y="440" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">then: render the pipeline → managed resources → the provider reconciles each one</text></g><g opacity="1.000"><circle cx="636" cy="404" r="11" fill="#3DFF9A"/><path d="M631,404 l4,4 l7,-8" stroke="#FFFFFF" stroke-width="2.5" fill="none"/></g><g opacity="1.000"><circle cx="636" cy="419" r="11" fill="#3DFF9A"/><path d="M631,419 l4,4 l7,-8" stroke="#FFFFFF" stroke-width="2.5" fill="none"/></g><g opacity="1.000"><circle cx="636" cy="434" r="11" fill="#3DFF9A"/><path d="M631,434 l4,4 l7,-8" stroke="#FFFFFF" stroke-width="2.5" fill="none"/></g><g opacity="0.926"><text x="40" y="490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7C8A82" text-anchor="start" font-style="italic">Nothing is improvised at request time. Only what platform engineering pre-registered can be</text><text x="40" y="507" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7C8A82" text-anchor="start" font-style="italic">served.</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="732" y="442" width="180" height="44" rx="8" fill="#0B0E0C" stroke="#FFB000" stroke-width="1.5"/><text x="822" y="462" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">AppStack billing-api</text><text x="822" y="480" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">freight sha256:4a1f…</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="932" y="444" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1002" y="457" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">WorkersScript</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="1082" y="444" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1152" y="457" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">WorkerDomain</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="932" y="466" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1002" y="479" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">R2Bucket</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="1082" y="466" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1152" y="479" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">D1Database</text></g><rect x="0" y="624" width="1280" height="96" fill="#0B0E0C"/><rect x="0" y="624" width="1280" height="2" fill="#3DFF9A"/><text x="40" y="654" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3DFF9A" text-anchor="start">DAY 1 — SELF-SERVICE</text><text x="40" y="676" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#E6F2EA" text-anchor="start">The SSIP terminal writes the spec; the service verifies identity, validates against the XRD, stores signed freight, applies the AppStack. Kyverno admits it; Crossplane</text><text x="40" y="694" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#E6F2EA" text-anchor="start">looks for the registered XRD + Composition pair and composes.</text><rect x="40" y="616" width="1200" height="2" fill="#2A332E"/><rect x="40" y="616" width="723.1" height="2" fill="#3DFF9A"/></svg>