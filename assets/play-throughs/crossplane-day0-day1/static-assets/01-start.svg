xt><text x="350" y="358" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">guards and telemetry before any request exists</text></g><rect x="0" y="624" width="1280" height="96" fill="#0B0E0C"/><rect x="0" y="624" width="1280" height="2" fill="#3DFF9A"/><text x="40" y="654" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3DFF9A" text-anchor="start">DAY 0 — THE SUBSTRATE</text><text x="40" y="676" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#E6F2EA" text-anchor="start">Platform engineering runs make bootstrap once. Crossplane, the official upjet Cloudflare provider, the three functions, Kyverno and the OTel collector exist before any</text><text x="40" y="694" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#E6F2EA" text-anchor="start">request does.</text><rect x="40" y="616" width="1200" height="2" fill="#2A332E"/><rect x="40" y="616" width="92.3" height="2" fill="#3DFF9A"/></svg>