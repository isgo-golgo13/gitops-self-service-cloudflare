 opacity="1.000" transform="translate(0 0.0)"><rect x="716" y="418" width="508" height="72" rx="8" fill="#0B0E0C" stroke="#2A332E" stroke-width="1.5"/><text x="728" y="436" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7C8A82" text-anchor="start">namespace team-billing</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="40" y="70" width="620" height="48" rx="8" fill="#0B0E0C" stroke="#2A332E" stroke-width="1.5"/><text x="350" y="98" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FF4D4D" text-anchor="middle">THE OTHER BRANCH · a kind nobody registered</text></g><g opacity="1.000" transform="translate(0 0.0)"><g transform="translate(40 130)"><rect width="300" height="110" rx="10" fill="#0B0E0C" stroke="#2A332E"/><rect width="300" height="28" rx="10" fill="#101512"/><rect y="18" width="300" height="10" fill="#101512"/><circle cx="18" cy="14" r="5" fill="#FF5F57"/><circle cx="36" cy="14" r="5" fill="#FEBC2E"/><circle cx="54" cy="14" r="5" fill="#28C840"/><text x="150" y="18" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7C8A82" text-anchor="middle">kubectl apply</text><g transform="translate(0 28)"><rect width="300" height="82" fill="#070A08"/><text x="12" y="22" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#E6F2EA" text-anchor="start">kind: GpuCluster</text><text x="12" y="40" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="start">apiVersion: edgefactory.dronegrid.io/v1</text><text x="12" y="64" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#FF4D4D" text-anchor="start">no such XRD · no Composition</text></g></g></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="360" y="130" width="300" height="110" rx="8" fill="#0B0E0C" stroke="#FF4D4D" stroke-width="1.5"/><text x="510" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E6F2EA" text-anchor="middle">API server</text><text x="510" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">unknown kind → rejected at the door</text><text x="510" y="183" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">and even a known kind from kubectl</text><text x="510" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">is denied by Kyverno (not the SSIP identity)</text></g><g opacity="1.000"><circle cx="636" cy="154" r="11" fill="#FF4D4D"/><text x="636" y="158" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">✕</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="40" y="262" width="620" height="70" rx="8" fill="#0B0E0C" stroke="#2A332E" stroke-width="1.5"/><text x="350" y="282" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E6F2EA" text-anchor="middle">Why this matters</text><text x="350" y="300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">Self-service has a ceiling, and the ceiling is the inventory. Day 0 decides what day 1 can ask for;</text><text x="350" y="315" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">the API is the contract, the controller is the enforcement.</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="732" y="442" width="180" height="44" rx="8" fill="#0B0E0C" stroke="#FFB000" stroke-width="1.5"/><text x="822" y="462" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">AppStack billing-api</text><text x="822" y="480" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#7C8A82" text-anchor="middle">freight sha256:4a1f…</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="932" y="444" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1002" y="457" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">WorkersScript</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="1082" y="444" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1152" y="457" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">WorkerDomain</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="932" y="466" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1002" y="479" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">R2Bucket</text></g><g opacity="1.000" transform="translate(0 0.0)"><rect x="1082" y="466" width="140" height="18" rx="8" fill="#0B0E0C" stroke="#1BAF66" stroke-width="1.5"/><text x="1152" y="479" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#E6F2EA" text-anchor="middle">D1Database</text></g><rect x="0" y="624" width="1280" height="96" fill="#0B0E0C"/><rect x="0" y="624" width="1280" height="2" fill="#3DFF9A"/><text x="40" y="654" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3DFF9A" text-anchor="start">NO MATCH, NO SERVICE</text><text x="40" y="676" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#E6F2EA" text-anchor="start">A kind nobody registered is rejected by the API server; a known kind from kubectl is denied by Kyverno. Day 0 decides what day 1 may ask for.</text><rect x="40" y="616" width="1200" height="2" fill="#2A332E"/><rect x="40" y="616" width="846.2" height="2" fill="#3DFF9A"/></svg>