# OpenBao via Kubernetes auth: the external-secrets ServiceAccount's projected token is
# exchanged for a short-lived OpenBao token bound to this cluster, namespace and SA.
# (ESO's "vault" provider speaks the API OpenBao implements.)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.dronegrid.io
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: internal-ca
        key: ca.crt
        namespace: flux-system
      auth:
        kubernetes:
          mountPath: kubernetes-k3s-edge
          role: edge-factory
          serviceAccountRef:
            name: external-secrets
            namespace: flux-system
