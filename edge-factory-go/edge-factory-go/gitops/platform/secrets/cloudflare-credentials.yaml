apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: cloudflare-credentials, namespace: flux-system }
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: cloudflare-credentials, creationPolicy: Owner }
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef: { key: cloudflare/prod/apply, property: cloudflare_api_token }
    - secretKey: TF_VAR_postgres_origins
      remoteRef: { key: cloudflare/prod/apply, property: postgres_origins }
