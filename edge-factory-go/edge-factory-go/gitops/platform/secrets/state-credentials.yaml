apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: state-credentials
  namespace: flux-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: state-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: cloudflare/prod/apply
        property: r2_state_access_key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: cloudflare/prod/apply
        property: r2_state_secret_key
