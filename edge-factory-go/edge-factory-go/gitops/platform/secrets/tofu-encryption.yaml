# The OpenTofu encryption configuration is composed here from the secret (used as the pbkdf2
# passphrase; "static" is not a shipped key provider), so the
# runner receives a complete TF_ENCRYPTION value and the key never appears in git or in a CR.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tofu-encryption
  namespace: flux-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tofu-encryption
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TF_ENCRYPTION: |
          key_provider "pbkdf2" "primary" {
            passphrase = "{{ .tofu_encryption_key }}"
          }
          method "aes_gcm" "primary" {
            keys = key_provider.pbkdf2.primary
          }
          state {
            method   = method.aes_gcm.primary
            enforced = true
          }
          plan {
            method   = method.aes_gcm.primary
            enforced = true
          }
  data:
    - secretKey: tofu_encryption_key
      remoteRef:
        key: cloudflare/prod/apply
        property: tofu_encryption_key
