[workspace]
resolver = "3"
members = ["crates/edgefactory-core", "crates/edgefactory-ssip", "crates/edgefactory-tui"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["DroneGrid platform engineering <platform@dronegrid.io>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
kube = { version = "1", features = ["runtime", "derive", "client", "rustls-tls"], default-features = false }
# Must match the k8s-openapi version kube 1.x depends on (0.25); exactly one copy, one version feature.
k8s-openapi = { version = "0.25", features = ["v1_33"] }
jsonschema = { version = "0.30", default-features = false }
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
oci-client = { version = "0.15", default-features = false, features = ["rustls-tls"] }
axum = { version = "0.8", features = ["json", "macros"] }
tower-http = { version = "0.6", features = ["trace"] }
jsonwebtoken = "9"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }