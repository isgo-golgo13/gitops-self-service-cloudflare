<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Edge Factory XP"><rect width="1200" height="440" fill="#FFFFFF"/><text x="40" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Edge Factory XP - one AppStack XR, signed freight, Crossplane reconciling per resource</text><rect x="40" y="100" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="125" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">edgefactory TUI</text><text x="125" y="148" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">--mode xp</text><defs><marker id="ah10370000000" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><path d="M210,140 L260,140" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#ah10370000000)"/><text x="235" y="128" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="middle" font-style="italic">OIDC</text><rect x="260" y="100" width="180" height="80" rx="6" fill="#FFFFFF" stroke="#D7262C" stroke-width="3"/><text x="350" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">SSIP service</text><text x="350" y="148" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">validate -> freight -> apply</text><defs><marker id="ah15420000000" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><path d="M440,120 L500,120" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#ah15420000000)"/><text x="470" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="middle" font-style="italic">push + sign</text><path d="M500,100 v50 a75,10 0 0 0 150,0 v-50" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><ellipse cx="575" cy="100" rx="75" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="575" y="131" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">GHCR</text><text x="575" y="149" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="middle">freight</text><defs><marker id="ah15110000000" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><path d="M350,180 L350,230" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#ah15110000000)"/><rect x="40" y="230" width="560" height="180" rx="10" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 5"/><text x="52" y="222" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="start">k3s  (Crossplane 2 + provider-upjet-cloudflare)</text><rect x="60" y="260" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#D7262C" stroke-width="3"/><text x="135" y="286" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">AppStack XR</text><text x="135" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">admission: SSIP + digest</text><rect x="230" y="260" width="170" height="60" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="315" y="286" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">XRD + Composition</text><text x="315" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">the profile table as data</text><rect x="420" y="260" width="170" height="60" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="505" y="286" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">MRs</text><text x="505" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">WorkersScript, R2Bucket,</text><text x="505" y="326" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">D1Database, AccessApp…</text><defs><marker id="ah14660000000" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><path d="M210,290 L230,290" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#ah14660000000)"/><defs><marker id="ah19220000000" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><path d="M400,290 L420,290" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#ah19220000000)"/><text x="60" y="350" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start" font-style="italic">No MRs by hand: RBAC by kind, admission policy, 10 kinds activated.</text><text x="60" y="368" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start" font-style="italic">WorkersScript has no Update policy: wrangler deploys are never reverted. Status carries the wrangler bindings.</text><rect x="620" y="230" width="560" height="230" rx="10" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 5"/><text x="632" y="222" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="start">CLOUDFLARE  (what one AppStack becomes)</text><rect x="640" y="260" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#D7262C" stroke-width="3"/><text x="720" y="286" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">Worker shell</text><text x="720" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">custom domain · observability</text><rect x="820" y="260" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="900" y="286" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">R2 bucket</text><text x="900" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">objects · lifecycle</text><rect x="1000" y="260" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="1080" y="286" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">D1  |  Hyperdrive</text><text x="1080" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">SQLite · ext. Postgres</text><rect x="640" y="340" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="720" y="366" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">Zero Trust Access</text><text x="720" y="388" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">private only</text><rect x="820" y="340" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="900" y="366" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">Zone baseline</text><text x="900" y="388" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">managed WAF · rate limits</text><rect x="1000" y="340" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="1080" y="366" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">Load balancer</text><text x="1080" y="388" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">hybrid only · origins</text><text x="640" y="435" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start" font-style="italic">code + container: wrangler deploy into the shell (platform owns shell + data; team owns code)</text><defs><marker id="ah24980D7262C" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#D7262C"/></marker></defs><path d="M600,320 L620,320" fill="none" stroke="#D7262C" stroke-width="3" marker-end="url(#ah24980D7262C)"/></svg>